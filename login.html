<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Đăng nhập</title>
    <style>
        body {
            background: url("./mapping.png");
            width: 100%;
            height: 100vh;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
        }

        .contain {
            background: rgba(255, 255, 255, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 40px;
            width: 500px;
            border-radius: 10px;
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .logo-img {
            height: 100px;
            border-radius: 20px;
            border: 1px solid #000;
        }

        .form-label {
            font-weight: bold;
            font-size: 18px;
        }

        .btnSubmit {
            float: right;
        }

        #username,
        #password {
            outline: none;
            /*    border: none;*/
            margin-right: 1px;
        }

        .form-control:focus {
            box-shadow: none;
            border: none;
        }
    </style>
</head>

<body>
    <div class="contain">
        <div class="logo">
            <!-- <img class="logo-img" src="~/images/logo_alpha.jpg" alt="Logo Company" /> -->
        </div>
        <div id="login-message" class="mt-3"></div>
        <div id="form">
            <div class="mb-3">
                <label for="username" class="form-label">Tài khoản</label>
                <input type="text" class="form-control" id="username" name="UserName" aria-describedby="emailHelp" />
                <span id="error-username" class="text-danger"></span>
                <!-- <span asp-validation-for="UserName" id="error-username" class="text-danger"></span> -->

            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="Password" />
                    <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <span id="error-password" class="text-danger"></span>
                <!-- <span asp-validation-for="Password" id="error-password" class="text-danger"></span> -->

            </div>
            <button id="btnLogin" class="btn btn-primary btnSubmit">
                Đăng nhập
            </button>
            <div class="clear"></div>
        </div>

</body>

</html>
