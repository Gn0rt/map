  <body>
    <div id="map"></div>
    <div id="log-container">
      <div class="tabs">
        <p class="tab active" data-tab="giam-sat">Giám sát</p>
        <p class="tab" data-tab="lo-trinh">Lộ trình</p>
      </div>
      <div id="giam-sat" class="giamsat tab-content active">
        <form action="">
          <div class="form-control">
            <label for="">MMSI: </label>
            <input
              type="text"
              class="search-input"
              id=""
              placeholder="Nhập MMIS..."
            />
          </div>
        </form>
        <table id="log-table" class="customTable">
          <thead>
            <tr>
              <th>Icon</th>
              <th>MMSI</th>
              <th>V(Km/h)</th>
              <th>TIme</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div class="lists">
          <ul class="list-items">
            <li class="item item-a">
              <i class="fa-solid fa-mobile"></i>
              <span>Thiết bị xanh</span>
            </li>
            <li class="item item-b">
              <i class="fa-solid fa-mobile-screen"></i>
              <span>Thiết bị đỏ</span>
            </li>
            <li class="item item-c">
              <i class="fa-solid fa-mobile-screen-button"></i>
              <span>Thiết bị xanh</span>
            </li>
            <li class="item item-d">
              <i class="fa-solid fa-mobile-vibrate"></i>
              <span>Thiết bị vàng</span>
            </li>
            <li>
              <span class="count" style="margin-top: 0">10</span>
              <span>Tổng thiết bị</span>
            </li>
          </ul>
        </div>
      </div>
      <div id="lo-trinh" class="lotrinh tab-content">
        <form action="">
          <div class="form-control">
            <label for="">Từ: </label>
            <input type="text" class="date-input" id="datestart" />
            <input type="text" class="time-input" id="timestart" />
          </div>
          <div class="form-control">
            <label for="">Đến: </label>
            <input type="text" class="date-input" id="datefinish" />
            <input type="text" class="time-input" id="timefinish" />
          </div>

          <button type="button" id="btnSearch">Tìm kiếm</button>
        </form>
        <table id="tableFollow" class="customTables">
          <thead>
            <tr>
              <th>Icon</th>
              <th>MMSI</th>
              <th>V(Km/h)</th>
              <th>TIme</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

          initComplete: function () {

        $("#tableFollow").DataTable({
          data: sampleData,
          searching: true,
          autoWidth: false,
          scrollY: "50vh",
          scrollX: true,
          scrollCollapse: true,
          orderCellsTop: true, // Bắt buộc: Để nó biết dòng 1 là Header Sort, dòng 2 là cái khác
          paging: false,
          info: false,
          columns: [
            {

          initComplete: function () {
            var api = this.api();

            // Dùng setTimeout để đảm bảo CSS thanh cuộn đã được áp dụng xong
            // rồi mới bắt DataTables tính lại độ rộng cột
            setTimeout(function () {
              api.columns.adjust();
            }, 200);
          },
        });

        // 1. Cấu hình Datepicker & Timepicker
        const configDate = $.extend({}, $.datepicker.regional["vi"], {
          dateFormat: "dd-mm-yy",
          changeMonth: true,
          changeYear: true,
        });

        // const configTime = $.extend({}, $.timepicker.regional["vi"], {
        //   hourText: "Giờ",
        //   minuteText: "Phút",
        //   secondText: "Giây",
        //   timeFormat: "HH:mm:ss",
        //   showSecond: true,
        //   controlType: "slider",
        //   oneLine: false,
        // });
        // Khởi tạo datepicker
        let now = new Date();
        // Setup Datepicker
        const $dateStart = $("#datestart")
          .datepicker(configDate)
          .datepicker("setDate", now);
        const $dateEnd = $("#datefinish")
          .datepicker(configDate)
          .datepicker("setDate", now);

        // Setup Timepicker
        const $timeStart = $("#timestart")
          .timepicker({
            timeFormat: "HH:mm:ss",
            interval: 5,
            dynamic: false,
            dropdown: false,
            scrollbar: true,
          })
          .val("00:00:00");

        // Lấy giờ hiện tại HH:mm:00
        const timeDisplay = now.toTimeString().split(" ")[0]; // Cách lấy giờ nhanh hơn
        const $timeEnd = $("#timefinish")
          .timepicker({
            timeFormat: "HH:mm:ss",
            interval: 5,
            dynamic: false,
            dropdown: false,
            scrollbar: true,
          })
          .val(timeDisplay);
        // Biến lưu trữ giá trị (Global state)
        let globalState = {
          batdau: "",
          ketthuc: "",
          batdauView: "", // Định dạng YYYY-MM-DD HH:mm:ss
          ketthucView: "",
        };

        // Hàm lấy ngày giờ format: HH:mm:ss dd-mm-yyyy
        function getDateTimeString($dateInput, $timeInput) {
          let dateVal = $dateInput.val();
          let timeVal = $timeInput.val();

          // Fix lỗi nếu timepicker trả về thiếu giây (HH:mm)
          if (timeVal && timeVal.length === 5) {
            timeVal += ":00";
          }
          return `${timeVal} ${dateVal}`;
        }
        // Hàm chuyển đổi dd-mm-yyyy -> yyyy-mm-dd để dùng cho SQL/View
        function convertToISODate(dateStr) {
          if (!dateStr) return "";
          const parts = dateStr.split("-"); // [dd, mm, yyyy]
          if (parts.length !== 3) return dateStr;
          return `${parts[2]}-${parts[1]}-${parts[0]}`; // yyyy-mm-dd
        }
        // 4. Hàm xử lý chính khi có thay đổi
        function handleDateTimeChange() {
          // Lấy giá trị thô (HH:mm:ss dd-mm-yyyy)
          globalState.batdau = getDateTimeString($dateStart, $timeStart);
          globalState.ketthuc = getDateTimeString($dateEnd, $timeEnd);

          // Tạo giá trị View (HH:mm:ss yyyy-mm-dd) hoặc (yyyy-mm-dd HH:mm:ss) tùy backend bạn cần
          // Ở code cũ bạn để Time trước Date cho biến View, mình giữ nguyên logic đó
          const dateStartISO = convertToISODate($dateStart.val());
          const dateEndISO = convertToISODate($dateEnd.val());

          globalState.batdauView = `${$timeStart.val()} ${dateStartISO}`;
          globalState.ketthucView = `${$timeEnd.val()} ${dateEndISO}`;

          // Log kiểm tra
          console.log("--- Cập nhật thời gian ---");
          console.log("Bắt đầu (Raw):", globalState.batdau);
          console.log("Kết thúc (Raw):", globalState.ketthuc);
          console.log("Bắt đầu (View):", globalState.batdauView);
          console.log("Kết thúc (View):", globalState.ketthucView);

          // TODO: Gọi hàm lọc dữ liệu bảng tại đây (nếu có)
          // filterRouteData();
        }
        $("#datestart, #datefinish, #timestart, #timefinish").on(
          "change",
          handleDateTimeChange
        );

        // Chạy lần đầu để khởi tạo giá trị
        handleDateTimeChange();
